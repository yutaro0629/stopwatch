<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Stopwatch</h1>
    <div id="display" class="display">00:00:00.<span id="ms">00</span></div>
    <div class="buttons">
      <button id="startBtn" class="btn start">スタート</button>
      <button id="stopBtn" class="btn stop" disabled>ストップ</button>
      <button id="lapBtn" class="btn lap" disabled>ラップ</button>
      <button id="resetBtn" class="btn reset" disabled>リセット</button>
    </div>
    <ol id="laps" class="laps"></ol>
  </main>
  <script src="script.js"></script>
</body>
</html>
